terminology:
  - {id: persona, fr: "persona", ru: "персона (портрет пользователя)", en: "persona"}
  - {id: usability, fr: "utilisabilité", ru: "юзабилити (удобство использования)", en: "usability"}
  - {id: prototype, fr: "prototype", ru: "прототип", en: "prototype"}
methodology:
