validation_rules:
  - {id: accessibility, severity: warning, description: {fr: "Contrastes et lisibilité conformes aux règles d'accessibilité (WCAG).", ru: "Контраст и читаемость по требованиям доступности (WCAG).", en: "Contrast and legibility meet accessibility rules (WCAG)."}}
standards:
  - {code: "ISO 9241-210", convention: intl, title: {fr: "Conception centrée sur l'opérateur humain", ru: "Человеко-ориентированное проектирование интерактивных систем", en: "Human-centred design for interactive systems"}}
  - {code: "WCAG 2.2", convention: intl, title: {fr: "Règles pour l'accessibilité des contenus web", ru: "Руководство по доступности веб-контента", en: "Web Content Accessibility Guidelines"}}
