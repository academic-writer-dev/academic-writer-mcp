# Structures de base des documents par convention de présentation.
#   ru   : usages russes (ГОСТ / ЕСКД) — les exigences du вуз / de la кафедра priment.
#   fr   : usages francophones (NF / EN) — les exigences de l'établissement priment.
#   intl : usages internationaux (ISO, revues scientifiques).
# Les références normatives sont indicatives : vérifier l'édition en vigueur.
# Identifiants de sections communs (introduction, conclusion, references...) : ils servent
# de points d'ancrage aux sections ajoutées par les profils disciplinaires.

families:
  travaux_courts: [td, tp, devoir]
  rapport_laboratoire: [rapport_laboratoire]
  projet: [projet_universitaire]
  memoire: [memoire_licence, memoire_master]
  these: [these_doctorat]
  article: [article_scientifique, communication_scientifique]
  rapport_technique: [rapport_technique, etude_technique, document_conception]
  rapport_intervention: [rapport_inspection, rapport_maintenance, rapport_audit]
  cahier_des_charges: [cahier_des_charges]
  procedure: [procedure_operationnelle, documentation_professionnelle]
  autre: [autre]

