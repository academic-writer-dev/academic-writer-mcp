[project]
name = "academic-writer"
version = "0.9.0"
description = "Serveur MCP local d'assistance à la rédaction, vérification et mise en forme de documents académiques et techniques."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "charset-normalizer>=3.3",
    "keyring>=25",
    "mcp[cli]>=2.3,<3",
    "openai>=2.0",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pillow>=10",
    "pydantic>=2",
    "pydantic-settings>=2.6",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "pyyaml>=6.0",
    "sympy>=1.13",
    "truststore>=0.10",
]

[project.scripts]
academic-writer = "academic_writer:main"

[project.optional-dependencies]
pymupdf = [
    "pymupdf>=1.26",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pymupdf>=1.26",
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
