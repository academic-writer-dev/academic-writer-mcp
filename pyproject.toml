[project]
name = "academic-writer"
version = "0.2.0"
description = "Serveur MCP local d'assistance à la rédaction, vérification et mise en forme de documents académiques et techniques."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3,<3",
    "pydantic>=2",
    "pydantic-settings>=2.6",
]

[project.scripts]
academic-writer = "academic_writer:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
